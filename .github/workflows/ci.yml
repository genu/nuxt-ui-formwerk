name: CI

on:
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare
        run: pnpm dev:prepare

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm test:types

      - name: Run tests
        run: pnpm test

      - name: Build
        run: |
          set -o pipefail
          pnpm prepack 2>&1 | tee build.log

      # nuxt-module-build exits 0 even when the declaration emitter fails, and
      # vue-sfc-transformer then writes an empty .d.ts that breaks consumers.
      - name: Check declaration output
        run: |
          if grep -q 'error TS' build.log; then
            echo '::error::prepack reported TypeScript errors — declarations are unreliable'
            grep 'error TS' build.log
            exit 1
          fi

          empty=$(find dist \( -name '*.d.ts' -o -name '*.d.vue.ts' \) -empty)
          if [ -n "$empty" ]; then
            echo '::error::empty declaration files were emitted'
            echo "$empty"
            exit 1
          fi
