name: CI

on:
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The playground is deliberately out of scope here: it is a local sandbox,
      # not a workspace member, so its dependencies are never installed. Use
      # `pnpm test:types:all` locally to cover it. test/types checks the public
      # API on purpose, which is the coverage that matters.
      - name: Prepare
        run: pnpm dev:prepare

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm test:types

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm prepack

      # Type-checks dist/ the way a consumer does. Catches the declaration
      # emitter failing silently, which `prepack` itself reports as success.
      - name: Verify dist
        run: pnpm verify:dist
