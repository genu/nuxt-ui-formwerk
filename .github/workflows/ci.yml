name: CI

on:
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Also prepares the playground, which the playground type check needs.
      - name: Prepare
        run: pnpm dev:prepare:playground

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm test:types:all

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm prepack

      - name: Verify declaration output
        run: pnpm verify:dist
